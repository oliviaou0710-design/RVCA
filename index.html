<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVCA 角色庫</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    background: #f4f5f7;
    color: #333;
}

/* =========================
   Header
========================= */

header {
    height: 64px;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    padding: 0 18px;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.menu-btn {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
}

.menu-btn:hover {
    background: #f1f1f1;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #222;
}

.header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-name {
    font-size: 13px;
    color: #777;
}

button {
    font-family: inherit;
}

/* =========================
   Menu
========================= */

.menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.25);
    z-index: 1999;
    display: none;
}

.menu-overlay.show {
    display: block;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -300px;
    width: 280px;
    height: 100vh;
    background: #fff;
    z-index: 2000;
    box-shadow: 4px 0 20px rgba(0,0,0,.12);
    transition: left .25s ease;
    padding-top: 22px;
}

.side-menu.open {
    left: 0;
}

.menu-title {
    padding: 0 24px 22px;
    font-size: 20px;
    font-weight: 700;
}

.menu-item {
    width: calc(100% - 24px);
    margin: 4px 12px;
    padding: 14px 16px;
    border: none;
    background: transparent;
    border-radius: 10px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.menu-item:hover {
    background: #f4f4f4;
}

.menu-item.active {
    background: #ececf0;
    font-weight: 700;
}

/* =========================
   Main
========================= */

main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 25px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.page-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 18px;
}

/* =========================
   Character Toolbar
========================= */

.toolbar {
    background: white;
    border: 1px solid #e4e4e4;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}

.search-box {
    flex: 1;
    min-width: 180px;
    padding: 10px 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 14px;
}

select,
input,
textarea {
    font-family: inherit;
}

select {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    background: white;
}

.primary-btn,
.secondary-btn,
.danger-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 14px;
}

.primary-btn {
    background: #333;
    color: white;
}

.primary-btn:hover {
    background: #111;
}

.secondary-btn {
    background: #eeeeee;
    color: #333;
}

.secondary-btn:hover {
    background: #e2e2e2;
}

.danger-btn {
    background: #f1dede;
    color: #9b3333;
}

/* =========================
   Character Cards
========================= */

.character-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 18px;
}

.character-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 15px;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
}

.character-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
}

.character-avatar {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #eeeeee;
}

.character-info {
    padding: 15px;
}

.character-name {
    font-size: 19px;
    font-weight: 700;
}

.character-alias {
    color: #888;
    font-size: 13px;
    margin-top: 3px;
}

.character-meta {
    margin-top: 10px;
    line-height: 1.7;
    font-size: 13px;
    color: #666;
}

.card-actions {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}

.card-actions button {
    flex: 1;
}

.empty-state {
    background: white;
    border: 1px dashed #ccc;
    border-radius: 15px;
    padding: 50px 20px;
    text-align: center;
    color: #888;
}

/* =========================
   World
========================= */

.world-layout {
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    gap: 20px;
    min-height: calc(100vh - 140px);
}

.world-sidebar {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 15px;
    padding: 15px;
    height: fit-content;
    position: sticky;
    top: 85px;
}

.world-sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.world-sidebar-title {
    font-size: 17px;
    font-weight: 700;
}

.world-page-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.world-page-item {
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    padding: 11px 12px;
    border-radius: 9px;
    cursor: pointer;
    color: #444;
}

.world-page-item:hover {
    background: #f4f4f4;
}

.world-page-item.active {
    background: #ececf0;
    font-weight: 700;
}

.world-page-item-title {
    font-size: 14px;
}

.world-page-item-date {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
}

.world-editor {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 15px;
    padding: 28px;
    min-height: 700px;
}

.world-editor-empty {
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    text-align: center;
}

.world-editor-top {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.world-icon-input {
    width: 60px;
    text-align: center;
    font-size: 24px;
    border: 1px solid #ddd;
    border-radius: 9px;
}

.world-title-input {
    flex: 1;
    font-size: 26px;
    font-weight: 700;
    border: none;
    border-bottom: 1px solid #ddd;
    outline: none;
    padding: 7px 5px;
}

.world-title-input:focus {
    border-bottom-color: #777;
}

.world-content {
    width: 100%;
    min-height: 540px;
    resize: vertical;
    border: none;
    outline: none;
    font-size: 16px;
    line-height: 2;
    color: #333;
    background: transparent;
}

.world-editor-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-top: 1px solid #eee;
    padding-top: 15px;
    margin-top: 15px;
}

.world-updated {
    font-size: 12px;
    color: #999;
}

/* =========================
   Placeholder
========================= */

.coming-soon {
    background: #fff;
    border: 1px solid #e4e4e4;
    border-radius: 15px;
    padding: 70px 20px;
    text-align: center;
}

.coming-soon-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.coming-soon h2 {
    margin: 0 0 10px;
}

.coming-soon p {
    color: #888;
}

/* =========================
   Modal
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: white;
    width: min(900px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 16px;
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 13px;
    color: #666;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.avatar-preview {
    width: 120px;
    height: 120px;
    border-radius: 12px;
    object-fit: cover;
    background: #eee;
    margin-bottom: 8px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* =========================
   Responsive
========================= */

@media (max-width: 760px) {

    header {
        padding: 0 10px;
    }

    .logo {
        font-size: 18px;
    }

    .user-name {
        display: none;
    }

    main {
        padding: 15px;
    }

    .world-layout {
        grid-template-columns: 1fr;
    }

    .world-sidebar {
        position: static;
    }

    .world-page-list {
        max-height: 190px;
        overflow-y: auto;
    }

    .world-editor {
        padding: 18px;
        min-height: 600px;
    }

    .world-title-input {
        font-size: 22px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .character-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .character-info {
        padding: 10px;
    }

    .character-name {
        font-size: 16px;
    }

    .card-actions {
        flex-direction: column;
    }

    .toolbar {
        padding: 10px;
    }
}

@media (max-width: 430px) {

    .character-grid {
        grid-template-columns: 1fr;
    }

    .world-editor-bottom {
        flex-direction: column;
        align-items: stretch;
    }
}
</style>
</head>

<body>

<!-- =========================
     Header
========================= -->

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* =========================================================
   全域狀態
========================================================= */

let currentUser = null;

let cloudMode = false;

let characters = [];

let editingCharacterId = null;

let currentAvatar = "";

let worldPages = [];

let currentWorldPageId = null;


/* =========================================================

========================================================= */

const CHARACTER_STORAGE =
    "rvca_characters";

const SORT_STORAGE =
    "rvca_sort";

const WORLD_STORAGE =
    "rvca_world_pages";

const WORLD_SELECTED_STORAGE =

/* =========================================================
   工具
========================================================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(timestamp) {

    if (!timestamp) {
        return "";
    }

    try {

        const date =
            timestamp instanceof Date
                ? timestamp
                : new Date(timestamp);

        return date.toLocaleString(
            "zh-TW",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch {
        return "";
    }
}


function generateId() {

    return Date.now().toString(36)
        + Math.random()
            .toString(36)
            .substring(2, 9);
}


/* =========================================================
   Menu
========================================================= */

const menuBtn =
    document.getElementById("menuBtn");

const sideMenu =
    document.getElementById("sideMenu");

const menuOverlay =
    document.getElementById("menuOverlay");


function openMenu() {

    sideMenu.classList.add("open");

    menuOverlay.classList.add("show");
}


function closeMenu() {

    sideMenu.classList.remove("open");

    menuOverlay.classList.remove("show");
}


menuBtn.addEventListener(
    "click",
    () => {

        if (
            sideMenu.classList.contains("open")
        ) {
            closeMenu();
        } else {
            openMenu();
        }

    }
);


menuOverlay.addEventListener(
    "click",
    closeMenu
);


document
    .querySelectorAll(".menu-item")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                switchSection(
                    button.dataset.section
                );

                closeMenu();

            }
        );

    });


function switchSection(section) {

    document
        .querySelectorAll(".section")
        .forEach(el => {

            el.classList.remove("active");

        });


    document
        .querySelectorAll(".menu-item")
        .forEach(el => {

            el.classList.remove("active");

        });

/* =========================================================
   Avatar Compression
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        resolve => {

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            const maxSize = 1000;

                            let width =
                                img.width;

                            let height =
                                img.height;

                            if (
                                width > maxSize ||
                                height > maxSize
                            ) {

                                const scale =
                                    Math.min(
                                        maxSize / width,
                                        maxSize / height
                                    );

                                width *= scale;
                                height *= scale;

                            }

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            let result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.82
                                );

                            if (
                                result.length >
                                900000
                            ) {

                                result =
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        0.65
                                    );

                            }

                            resolve(result);

                        };

                    img.src =
                        event.target.result;

                };

            reader.readAsDataURL(file);

        }
    );

}

            ).value.trim(),

            ).value.trim(),

            ).value.trim(),

        backstory:
            document.getElementById(
                "backstoryInput"
            ).value.trim(),

        notes:
            document.getElementById(
                "notesInput"
            ).value.trim(),

        created:
            oldCharacter?.created ||
            Date.now()

    };


    const index =
        characters.findIndex(
            c =>
                c.id ===
                character.id
        );


    if (index >= 0) {

        characters[index] =
            character;

    } else {

        characters.push(
            character
        );

    try {

        if (
            cloudMode &&
            currentUser

            await setDoc(
                doc(
                    db,

/* =========================================================
   Render Characters
========================================================= */

function renderCharacters() {

    const grid =
        document.getElementById(
            "characterGrid"
        );

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const faction =
        document.getElementById(
            "factionFilter"
        ).value;


    const sort =
        document.getElementById(
            "sortSelect"
        ).value;


    localStorage.setItem(
        SORT_STORAGE,
        sort
    );


    let filtered =
        characters.filter(
            character => {

                const text =
                    [
                        character.name,
                        character.alias,
                        character.race,
                        character.faction,
                        character.home,
                        character.job
                    ]
                    .join(" ")
                    .toLowerCase();


                const matchSearch =
                    !search ||
                    text.includes(search);


                const matchFaction =
                    !faction ||
                    character.faction === faction;


                return (
                    matchSearch &&
                    matchFaction
                );

            }
        );


    filtered.sort(
        (a, b) => {

            if (sort === "name") {

                return String(
                    a.name || ""
                ).localeCompare(
                    String(
                        b.name || ""
                    )
                );

            }


            if (sort === "birthday") {

                return String(
                    a.birthday || ""
                ).localeCompare(
                    String(
                        b.birthday || ""
                    )
                );

            }


            if (sort === "faction") {

                return String(
                    a.faction || ""
                ).localeCompare(
                    String(
                        b.faction || ""
                    )
                );

            }


            return (
                Number(b.created || 0) -
                Number(a.created || 0)
            );

        }
    );


    updateFactionFilter();


    if (!filtered.length) {

        grid.innerHTML = `
            <div class="empty-state">
                目前沒有符合條件的角色。
            </div>
        `;

        return;

    }


    grid.innerHTML =
        filtered.map(
            character => `

                <article
                    class="character-card"
                    data-id="${escapeHtml(character.id)}"
                >

                    ${
                        character.avatar
                        ? `
                            <img
                                class="character-avatar"
                                src="${escapeHtml(character.avatar)}"
                            >
                        `
                        : `
                            <div
                                class="character-avatar"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    color:#999;
                                "
                            >
                                無頭像
                            </div>
                        `
                    }

                    <div class="character-info">

                        <div class="character-name">
                            ${escapeHtml(
                                character.name ||
                                "未命名角色"
                            )}
                        </div>

                        ${
                            character.alias
                            ? `
                                <div class="character-alias">
                                    ${escapeHtml(
                                        character.alias
                                    )}
                                </div>
                            `
                            : ""
                        }

                        <div class="character-meta">

                            <div>
                                ${escapeHtml(
                                    character.faction ||
                                    "未設定勢力"
                                )}
                            </div>

                            <div>
                                ${escapeHtml(
                                    character.race ||
                                    "未設定種族"
                                )}
                            </div>

                            <div>
                                ${escapeHtml(
                                    character.home ||
                                    "未設定居住地"
                                )}
                            </div>

                        </div>


                        <div class="card-actions">

                            <button
                                class="secondary-btn"
                                data-action="view"
                            >
                                查看
                            </button>

                            <button
                                class="secondary-btn"
                                data-action="edit"
                            >
                                編輯
                            </button>

                            <button
                                class="danger-btn"
                                data-action="delete"
                            >
                                刪除
                            </button>

                        </div>

                    </div>

                </article>

            `
        )
        .join("");

}

function updateFactionFilter() {

    const factions =
        [
            ...new Set(
                characters
                    .map(

                    .filter(Boolean)
            )
        ]
        .sort(
            (a, b) =>
                String(a)
                    .localeCompare(
                        String(b)
                    )
        );


    select.innerHTML = `

    factions.forEach(
        faction => {

        ).click();

    }
);


document.getElementById(
    "importFile"
).addEventListener(
    "change",
    async event => {

        const file =
            event.target.files?.[0];

        if (!file) {
            return;
        }


        try {

            const text =
                await file.text();

            const imported =
                JSON.parse(text);


            if (!Array.isArray(imported)) {

                throw new Error(
                    "格式錯誤"
                );

            }


            if (
                !confirm(
                    `確定要匯入 ${imported.length} 個角色嗎？`
                )
            ) {

                return;

            }


            imported.forEach(
                character => {

                    if (!character.id) {

                        character.id =
                            generateId();

                    }

                }
            );


            characters =
                imported;


            if (
                cloudMode &&
                currentUser
            ) {

                const chunks = [];

                for (
                    let i = 0;
                    i < characters.length;
                    i += 450
                ) {

                    chunks.push(
                        characters.slice(
                            i,
                            i + 450
                        )
                    );

                }


                for (
                    const chunk of chunks
                ) {

                    const batch =
                        writeBatch(db);

                    chunk.forEach(
                        character => {

                            const ref =
                                doc(
                                    db,
                                    "users",
                                    currentUser.uid,
                                    "characters",
                                    character.id
                                );

                            batch.set(
                                ref,
                                character
                            );

                        }
                    );

                    await batch.commit();

                }

            } else {

                saveCharactersLocal();

            }


            renderCharacters();

            alert(
                "角色資料匯入完成。"
            );

        } catch (error) {

            console.error(error);

            alert(
                "匯入失敗，請確認 JSON 檔案格式。"
            );

        }


        event.target.value = "";

    }
);

/* =========================================================

async function loadWorldPagesFromCloud() {

    if (!currentUser) {
        return;
    }


    try {

        const ref =
            collection(
                db,
                "users",
                currentUser.uid,
                "worldPages"
            );


        const snapshot =
            await getDocs(ref);


        worldPages =
            snapshot.docs.map(
                item => ({
                    ...item.data(),
                    id: item.id
                })
            );


        worldPages.sort(
            (a, b) =>
                Number(
                    a.created || 0
                ) -
                Number(
                    b.created || 0
                )
        );


        currentWorldPageId =
            localStorage.getItem(
                WORLD_SELECTED_STORAGE
            );


        if (
            !worldPages.some(
                p =>
                    p.id ===
                    currentWorldPageId
            )
        ) {

            currentWorldPageId =
                worldPages[0]?.id ||
                null;

        }

    } catch (error) {

        console.error(error);

        loadWorldPagesLocal();

        alert(
            "雲端世界觀資料讀取失敗，已暫時使用本機資料。"
        );

    }

}


/* =========================================================
   Create World Page
========================================================= */

document.getElementById(
    "newWorldPageBtn"
).addEventListener(
    "click",
    createWorldPage
);


async function createWorldPage() {

    const page = {

        id:
            generateId(),

        icon:
            "📖",

        title:
            "新的設定頁",

        content:
            "",

        created:
            Date.now(),

        updated:
            Date.now()

    };


    worldPages.push(
        page
    );


    currentWorldPageId =
        page.id;


    await saveWorldPageData(
        page
    );


    renderWorldPages();

    openWorldPage(
        page.id
    );

}


/* =========================================================
   Save World Page
========================================================= */

async function saveWorldPageData(
    page
) {

    try {

        if (
            cloudMode &&
            currentUser
        ) {

            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "worldPages",
                    page.id
                ),
                page,
                {
                    merge: false
                }
            );

        } else {

            saveWorldPagesLocal();

        }

        return true;

    } catch (error) {

        console.error(error);

        return false;

    }

}


/* =========================================================
   Render World Pages
========================================================= */

function renderWorldPages() {

    const list =
        document.getElementById(
            "worldPageList"
        );


    if (!list) {
        return;
    }


    if (!worldPages.length) {

        list.innerHTML = `
            <div style="
                color:#999;
                font-size:13px;
                padding:15px 8px;
                line-height:1.7;
            ">
                還沒有設定頁。<br>
                點右上角「＋」建立第一頁。
            </div>
        `;

        return;

    }


    list.innerHTML =
        worldPages
            .map(
                page => `

                    <button
                        class="world-page-item ${
                            page.id ===
                            currentWorldPageId
                                ? "active"
                                : ""
                        }"
                        data-page-id="${escapeHtml(page.id)}"
                    >

                        <div class="world-page-item-title">

                            ${escapeHtml(
                                page.icon || "📖"
                            )}

                            ${escapeHtml(
                                page.title ||
                                "未命名頁面"
                            )}

                        </div>

                        <div class="world-page-item-date">

                            ${formatDate(
                                page.updated ||
                                page.created
                            )}

                        </div>

                    </button>

                `
            )
            .join("");

}


/* =========================================================
   Select World Page
========================================================= */

document.getElementById(
    "worldPageList"
).addEventListener(
    "click",
    event => {

        const item =
            event.target.closest(
                ".world-page-item"
            );

        if (!item) {
            return;
        }


        openWorldPage(
            item.dataset.pageId
        );

    }
);


/* =========================================================
   Open World Page
========================================================= */

function openWorldPage(
    id
) {

    const page =
        worldPages.find(
            p => p.id === id
        );


    if (!page) {
        return;
    }


    currentWorldPageId =
        id;


    localStorage.setItem(
        WORLD_SELECTED_STORAGE,
        id
    );


    renderWorldPages();


    const editor =
        document.getElementById(
            "worldEditor"
        );


    editor.innerHTML = `

        <div class="world-editor-top">

            <input
                class="world-icon-input"
                id="worldIconInput"
                value="${escapeHtml(
                    page.icon || "📖"
                )}"
                maxlength="4"
                title="頁面圖示"
            >

            <input
                class="world-title-input"
                id="worldTitleInput"
                value="${escapeHtml(
                    page.title || ""
                )}"
                placeholder="設定頁標題"
            >

        </div>


        <textarea
            class="world-content"
            id="worldContentInput"
            placeholder="在這裡開始撰寫你的世界觀設定……

例如：

世界概述
這個世界是一個……

歷史
很久以前……

地理
主要大陸分為……

種族
這個世界存在……

勢力
目前主要勢力包括……

魔法／能力
能力來源是……

你可以自由決定每一頁要記錄什麼。"
        ></textarea>


        <div class="world-editor-bottom">

            <div
                class="world-updated"
                id="worldUpdatedText"
            >
                上次編輯：
                ${formatDate(
                    page.updated
                )}
            </div>


            <div style="
                display:flex;
                gap:8px;
                flex-wrap:wrap;
            ">

                <button
                    class="danger-btn"
                    id="deleteWorldPageBtn"
                >
                    刪除頁面
                </button>

                <button
                    class="primary-btn"
                    id="saveWorldPageBtn"
                >
                    儲存設定
                </button>

            </div>

        </div>

    `;


    document.getElementById(
        "worldContentInput"
    ).value =
        page.content || "";


    document.getElementById(
        "saveWorldPageBtn"
    ).addEventListener(
        "click",
        saveCurrentWorldPage
    );


    document.getElementById(
        "deleteWorldPageBtn"
    ).addEventListener(
        "click",
        deleteCurrentWorldPage
    );

}


/* =========================================================
   Save Current World Page
========================================================= */

async function saveCurrentWorldPage() {

    const page =
        worldPages.find(
            p =>
                p.id ===
                currentWorldPageId
        );


    if (!page) {
        return;
    }


    page.icon =
        document.getElementById(
            "worldIconInput"
        ).value.trim() ||
        "📖";


    page.title =
        document.getElementById(
            "worldTitleInput"
        ).value.trim() ||
        "未命名設定頁";


    page.content =
        document.getElementById(
            "worldContentInput"
        ).value;


    page.updated =
        Date.now();


    const success =
        await saveWorldPageData(
            page
        );


    if (success) {

        if (!cloudMode) {

            saveWorldPagesLocal();

        }


        renderWorldPages();


        document.getElementById(
            "worldUpdatedText"
        ).textContent =
            "已儲存："
            + formatDate(
                page.updated
            );


        alert(
            "世界觀設定已儲存。"
        );

    } else {

        alert(
            "世界觀設定儲存失敗。"
        );

    }

}


/* =========================================================
   Delete World Page
========================================================= */

async function deleteCurrentWorldPage() {

    const page =
        worldPages.find(
            p =>
                p.id ===
                currentWorldPageId
        );


    if (!page) {
        return;
    }


    if (
        !confirm(
            `確定要刪除「${page.title || "未命名頁面"}」嗎？`
        )
    ) {
        return;
    }


    try {

        if (
            cloudMode &&
            currentUser
        ) {

            await deleteDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "worldPages",
                    page.id
                )
            );

        }


        worldPages =
            worldPages.filter(
                p =>
                    p.id !==
                    page.id
            );


        currentWorldPageId =
            worldPages[0]?.id ||
            null;


        saveWorldPagesLocal();

        renderWorldPages();


        if (
            currentWorldPageId
        ) {

            openWorldPage(
                currentWorldPageId
            );

        } else {

            document.getElementById(
                "worldEditor"
            ).innerHTML = `

                <div class="world-editor-empty">

                    <div>

                        <div style="
                            font-size:45px;
                            margin-bottom:15px;
                        ">
                            📖
                        </div>

                        <div>
                            目前還沒有世界觀設定
                        </div>

                        <div style="
                            margin-top:8px;
                        ">
                            點左側「＋」建立第一頁
                        </div>

                    </div>

                </div>

            `;

        }

    } catch (error) {

        console.error(error);

        alert(
            "刪除世界觀頁面失敗。"
        );

    }

}

   初始排序設定

    );

if (savedSort) {

========================================================= */

        if (
            event.key ===

);

loadCharactersLocal();

loadWorldPagesLocal();

renderCharacters();

renderWorldPages();

</script>
