/* =========================================================
   關係圖座標轉換
========================================================= */

function getBoardPoint(
    clientX,
    clientY
) {

    const board =
        document.getElementById(
            "relationBoard"
        );


    const rect =
        board.getBoundingClientRect();


    return {

        x:
            (
                clientX -
                rect.left -
                relationPanX
            ) /
            relationScale,

        y:
            (
                clientY -
                rect.top -
                relationPanY
            ) /
            relationScale

    };

}


/* =========================================================
   關係圖節點位置
========================================================= */

function getNodeElement(
    nodeId
) {

    return document.querySelector(
        `.relation-node[data-node-id="${CSS.escape(nodeId)}"]`
    );

}


function getNodeCenter(
    node
) {

    const element =
        getNodeElement(
            node.id
        );


    if (!element) {

        return {
            x: node.x + 77,
            y: node.y + 36
        };

    }


    return {

        x:
            node.x +
            element.offsetWidth / 2,

        y:
            node.y +
            element.offsetHeight / 2

    };

}


/* =========================================================
   關係圖線條樣式
========================================================= */

function getStrokeDashArray(
    style
) {

    if (
        style === "dashed"
    ) {

        return "9 7";

    }


    if (
        style === "dotted"
    ) {

        return "2 7";

    }


    return "none";

}


/* =========================================================
   關係圖渲染
========================================================= */

function renderRelationBoard() {

    const inner =
        document.getElementById(
            "relationBoardInner"
        );


    const svg =
        document.getElementById(
            "relationSvg"
        );


    const empty =
        document.getElementById(
            "relationEmpty"
        );


    if (
        !inner ||
        !svg
    ) {

        return;

    }


    svg.querySelectorAll(
        ".relation-edge-group"
    ).forEach(
        item =>
            item.remove()
    );


    inner.querySelectorAll(
        ".relation-node"
    ).forEach(
        item =>
            item.remove()
    );


    empty.style.display =
        relationNodes.length
            ? "none"
            : "flex";


    relationNodes =
        relationNodes.filter(
            node =>
                characters.some(
                    character =>
                        character.id ===
                        node.characterId
                )
        );


    relationEdges =
        relationEdges.filter(
            edge =>
                relationNodes.some(
                    node =>
                        node.characterId ===
                        edge.from
                ) &&
                relationNodes.some(
                    node =>
                        node.characterId ===
                        edge.to
                )
        );


    relationEdges.forEach(
        edge => {

            const fromNode =
                relationNodes.find(
                    node =>
                        node.characterId ===
                        edge.from
                );


            const toNode =
                relationNodes.find(
                    node =>
                        node.characterId ===
                        edge.to
                );


            if (
                fromNode &&
                toNode
            ) {

                renderRelationEdge(
                    edge,
                    fromNode,
                    toNode
                );

            }

        }
    );


    relationNodes.forEach(
        node => {

            const character =
                characters.find(
                    item =>
                        item.id ===
                        node.characterId
                );


            if (!character) {
                return;
            }


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "relation-node";


            element.dataset.nodeId =
                node.id;


            element.style.left =
                node.x + "px";


            element.style.top =
                node.y + "px";


            const title =
                getCharacterTitle(
                    character
                );


            element.innerHTML = `

                ${
                    character.avatar
                    ? `
                        <img
                            class="relation-node-avatar"
                            src="${escapeHtml(
                                character.avatar
                            )}"
                            alt=""
                        >
                    `
                    : `
                        <div class="relation-node-no-avatar">
                            無頭像
                        </div>
                    `
                }


                <div class="relation-node-info">

                    <div class="relation-node-name">
                        ${escapeHtml(
                            character.name ||
                            "未命名角色"
                        )}
                    </div>

                    ${
                        title
                        ? `
                            <div class="relation-node-title">
                                ${escapeHtml(
                                    title
                                )}
                            </div>
                        `
                        : ""
                    }

                </div>

            `;


            element.addEventListener(
                "pointerdown",
                event =>
                    startRelationNodeDrag(
                        event,
                        node
                    )
            );


            element.addEventListener(
                "dblclick",
                event => {

                    event.stopPropagation();

                    openCharacterModal(
                        character
                    );

                }
            );


            inner.appendChild(
                element
            );

        }
    );


    applyRelationTransform();

}


/* =========================================================
   關係線
========================================================= */

function renderRelationEdge(
    edge,
    fromNode,
    toNode
) {

    const svg =
        document.getElementById(
            "relationSvg"
        );


    const from =
        getNodeCenter(
            fromNode
        );


    const to =
        getNodeCenter(
            toNode
        );


    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    group.classList.add(
        "relation-edge-group"
    );


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        from.x
    );


    line.setAttribute(
        "y1",
        from.y
    );


    line.setAttribute(
        "x2",
        to.x
    );


    line.setAttribute(
        "y2",
        to.y
    );


    line.setAttribute(
        "stroke",
        "#555"
    );


    line.setAttribute(
        "stroke-width",
        "2"
    );


    line.setAttribute(
        "fill",
        "none"
    );


    line.setAttribute(
        "stroke-dasharray",
        getStrokeDashArray(
            edge.style
        )
    );


    if (
        edge.arrow === "end" ||
        edge.arrow === "both"
    ) {

        line.setAttribute(
            "marker-end",
            "url(#arrowEnd)"
        );

    }


    if (
        edge.arrow === "start" ||
        edge.arrow === "both"
    ) {

        line.setAttribute(
            "marker-start",
            "url(#arrowStart)"
        );

    }


    line.classList.add(
        "relation-edge"
    );


    line.dataset.edgeId =
        edge.id;


    line.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            openRelationModal(
                edge
            );

        }
    );


    group.appendChild(
        line
    );


    if (edge.label) {

        const middleX =
            (
                from.x +
                to.x
            ) / 2;


        const middleY =
            (
                from.y +
                to.y
            ) / 2;


        const textBackground =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );


        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        text.textContent =
            edge.label;


        text.setAttribute(
            "x",
            middleX
        );


        text.setAttribute(
            "y",
            middleY - 7
        );


        text.setAttribute(
            "text-anchor",
            "middle"
        );


        text.setAttribute(
            "font-size",
            "12"
        );


        text.setAttribute(
            "fill",
            "#555"
        );


        text.classList.add(
            "relation-edge-label"
        );


        const textWidth =
            Math.max(
                20,
                edge.label.length *
                12
            );


        textBackground.setAttribute(
            "x",
            middleX -
            textWidth / 2 -
            5
        );


        textBackground.setAttribute(
            "y",
            middleY -
            20
        );


        textBackground.setAttribute(
            "width",
            textWidth + 10
        );


        textBackground.setAttribute(
            "height",
            "18"
        );


        textBackground.setAttribute(
            "rx",
            "5"
        );


        textBackground.setAttribute(
            "fill",
            "#fff"
        );


        textBackground.setAttribute(
            "opacity",
            "0.92"
        );


        textBackground.classList.add(
            "relation-edge-label"
        );


        group.appendChild(
            textBackground
        );


        group.appendChild(
            text
        );

    }


    svg.appendChild(
        group
    );

}


/* =========================================================
   關係圖：拖曳角色
========================================================= */

function startRelationNodeDrag(
    event,
    node
) {

    event.stopPropagation();


    relationDraggingNode =
        node;


    relationPointerId =
        event.pointerId;


    const point =
        getBoardPoint(
            event.clientX,
            event.clientY
        );


    relationDragOffsetX =
        point.x -
        node.x;


    relationDragOffsetY =
        point.y -
        node.y;


    const element =
        getNodeElement(
            node.id
        );


    if (element) {

        element.classList.add(
            "selected"
        );

    }


    document.addEventListener(
        "pointermove",
        moveRelationNode
    );


    document.addEventListener(
        "pointerup",
        endRelationNodeDrag,
        {
            once: true
        }
    );

}


function moveRelationNode(
    event
) {

    if (
        !relationDraggingNode
    ) {

        return;

    }


    if (
        relationPointerId !==
        null &&
        event.pointerId !==
        relationPointerId
    ) {

        return;

    }


    const point =
        getBoardPoint(
            event.clientX,
            event.clientY
        );


    relationDraggingNode.x =
        Math.max(
            0,
            point.x -
            relationDragOffsetX
        );


    relationDraggingNode.y =
        Math.max(
            0,
            point.y -
            relationDragOffsetY
        );


    renderRelationBoard();

}


async function endRelationNodeDrag() {

    document.removeEventListener(
        "pointermove",
        moveRelationNode
    );


    if (
        relationDraggingNode
    ) {

        try {

            await saveRelationData();

        } catch (error) {

            console.error(
                error
            );

        }

    }


    relationDraggingNode =
        null;

    relationPointerId =
        null;

}


/* =========================================================
   關係圖：白板拖曳
========================================================= */

const relationBoard =
    document.getElementById(
        "relationBoard"
    );


relationBoard.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(
                ".relation-node"
            ) ||
            event.target.closest(
                ".relation-edge"
            ) ||
            event.target.closest(
                ".relation-zoom"
            )
        ) {

            return;

        }


        relationPanning =
            true;


        relationPanStartX =
            event.clientX;


        relationPanStartY =
            event.clientY;


        relationPanOriginX =
            relationPanX;


        relationPanOriginY =
            relationPanY;


        relationBoard.setPointerCapture(
            event.pointerId
        );

    }
);


relationBoard.addEventListener(
    "pointermove",
    event => {

        if (
            !relationPanning
        ) {

            return;

        }


        relationPanX =
            relationPanOriginX +
            (
                event.clientX -
                relationPanStartX
            );


        relationPanY =
            relationPanOriginY +
            (
                event.clientY -
                relationPanStartY
            );


        applyRelationTransform();

    }
);


relationBoard.addEventListener(
    "pointerup",
    () => {

        relationPanning =
            false;

    }
);


relationBoard.addEventListener(
    "pointercancel",
    () => {

        relationPanning =
            false;

    }
);


/* =========================================================
   關係圖：縮放與控制
========================================================= */

function setRelationScale(
    newScale
) {

    relationScale =
        Math.min(
            2.5,
            Math.max(
                0.45,
                newScale
            )
        );


    applyRelationTransform();

}


function applyRelationTransform() {

    const inner =
        document.getElementById(
            "relationBoardInner"
        );


    if (!inner) {
        return;
    }


    inner.style.transform =
        `translate(${relationPanX}px, ${relationPanY}px) scale(${relationScale})`;


    const status =
        document.getElementById(
            "relationStatus"
        );


    if (status) {

        status.textContent =
            `縮放：${Math.round(relationScale * 100)}%`;

    }

}


document.getElementById(
    "relationZoomIn"
)?.addEventListener(
    "click",
    () => {

        setRelationScale(
            relationScale + 0.15
        );

    }
);


document.getElementById(
    "relationZoomOut"
)?.addEventListener(
    "click",
    () => {

        setRelationScale(
            relationScale - 0.15
        );

    }
);


document.getElementById(
    "relationZoomReset"
)?.addEventListener(
    "click",
    () => {

        setRelationScale(1);

    }
);


document.getElementById(
    "resetRelationViewBtn"
)?.addEventListener(
    "click",
    () => {

        relationScale = 1;

        relationPanX = 0;

        relationPanY = 0;

        applyRelationTransform();

    }
);


document.getElementById(
    "clearRelationSelectionBtn"
)?.addEventListener(
    "click",
    () => {

        document
            .querySelectorAll(
                ".relation-node.selected"
            )
            .forEach(
                el => {

                    el.classList.remove(
                        "selected"
                    );

                }
            );

    }
);


document.getElementById(
    "relationBoard"
)?.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        const zoomFactor =
            event.deltaY < 0
                ? 1.1
                : 0.9;


        setRelationScale(
            relationScale * zoomFactor
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   角色相簿：資料與圖片處理
========================================================= */

function getGalleryTypes() {
    try {
        const raw = localStorage.getItem(GALLERY_TYPES_STORAGE);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed) && parsed.length) {
            return parsed.filter(item => typeof item === "string" && item.trim());
        }
    } catch (error) {
        console.error(error);
    }
    return [...GALLERY_DEFAULT_TYPES];
}

function saveGalleryTypes(types) {
    const unique = [...new Set(types.map(item => String(item).trim()).filter(Boolean))];
    localStorage.setItem(GALLERY_TYPES_STORAGE, JSON.stringify(unique));
    return unique;
}

function loadGalleryLocal() {
    try {
        const raw = localStorage.getItem(GALLERY_STORAGE);
        galleryItems = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(galleryItems)) galleryItems = [];
    } catch (error) {
        console.error(error);
        galleryItems = [];
    }
}

function saveGalleryLocal() {
    try {
        localStorage.setItem(GALLERY_STORAGE, JSON.stringify(galleryItems));
    } catch (error) {
        console.error(error);
        throw new Error("本機儲存空間不足，請刪除部分相簿圖片後再試。");
    }
}

async function loadGalleryFromCloud() {
    if (!currentUser) return;
    try {
        const snapshot = await getDocs(
            collection(db, "users", currentUser.uid, "gallery")
        );
        galleryItems = snapshot.docs.map(item => ({ ...item.data(), id: item.id }));
        cloudMode = true;
    } catch (error) {
        console.error(error);
        loadGalleryLocal();
        alert("雲端相簿資料讀取失敗，目前使用本機相簿資料。");
    }
}

async function saveGalleryItem(item) {
    if (cloudMode && currentUser) {
        await setDoc(
            doc(db, "users", currentUser.uid, "gallery", item.id),
            item,
            { merge: false }
        );
    } else {
        saveGalleryLocal();
    }
}

async function deleteGalleryItem(id) {
    if (cloudMode && currentUser) {
        await deleteDoc(doc(db, "users", currentUser.uid, "gallery", id));
    } else {
        saveGalleryLocal();
    }
}

function galleryCharacterName(id) {
    if (!id) return "未指定角色";
    const character = characters.find(item => item.id === id);
    return character ? (character.name || "未命名角色") : "已不存在的角色";
}

function galleryFormatBytes(bytes) {
    if (!Number.isFinite(bytes)) return "";
    if (bytes < 1024) return `${bytes} B`;
    return `${(bytes / 1024).toFixed(0)} KB`;
}

function dataUrlBytes(dataUrl) {
    const comma = dataUrl.indexOf(",");
    if (comma < 0) return 0;
    const base64 = dataUrl.slice(comma + 1);
    return Math.floor(base64.length * 3 / 4) - (base64.endsWith("==") ? 2 : base64.endsWith("=") ? 1 : 0);
}

function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = event => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("圖片讀取失敗"));
            img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error("檔案讀取失敗"));
        reader.readAsDataURL(file);
    });
}

async function compressGalleryImage(file) {
    if (!file || !file.type.startsWith("image/")) {
        throw new Error("請選擇圖片檔案。");
    }

    const img = await loadImageFromFile(file);
    let width = img.naturalWidth || img.width;
    let height = img.naturalHeight || img.height;
    const maxDimension = 2200;

    if (Math.max(width, height) > maxDimension) {
        const scale = maxDimension / Math.max(width, height);
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
    }

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    if (!ctx) throw new Error("瀏覽器無法建立圖片處理畫布。");

    async function encode(w, h, quality) {
        canvas.width = w;
        canvas.height = h;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", quality);
    }

    let result = "";
    let currentWidth = width;
    let currentHeight = height;
    const qualities = [0.86, 0.78, 0.70, 0.62, 0.54, 0.46, 0.38, 0.30];

    for (let pass = 0; pass < 4; pass++) {
        for (const quality of qualities) {
            result = await encode(currentWidth, currentHeight, quality);
            if (dataUrlBytes(result) <= GALLERY_MAX_BYTES) {
                return result;
            }
        }
        currentWidth = Math.max(480, Math.round(currentWidth * 0.78));
        currentHeight = Math.max(480, Math.round(currentHeight * 0.78));
    }

    result = await encode(currentWidth, currentHeight, 0.24);
    if (dataUrlBytes(result) > GALLERY_MAX_BYTES) {
        throw new Error("圖片壓縮後仍超過 1 MB，請改用較小的圖片。");
    }
    return result;
}

function renderGalleryFilters() {
    const characterFilter = document.getElementById("galleryCharacterFilter");
    const typeFilter = document.getElementById("galleryTypeFilter");
    const characterInput = document.getElementById("galleryCharacterInput");
    const typeInput = document.getElementById("galleryTypeInput");
    if (!characterFilter || !typeFilter || !characterInput || !typeInput) return;

    const oldCharacter = characterFilter.value;
    const oldType = typeFilter.value;
    const oldInputCharacter = characterInput.value;
    const oldInputType = typeInput.value;

    characterFilter.innerHTML = `<option value="">全部角色</option><option value="__none__">未指定角色</option>`;
    characters
        .slice()
        .sort((a,b) => String(a.name || "").localeCompare(String(b.name || ""), "zh-Hant"))
        .forEach(character => {
            const option = document.createElement("option");
            option.value = character.id;
            option.textContent = character.name || "未命名角色";
            characterFilter.appendChild(option);
        });

    typeFilter.innerHTML = `<option value="">全部類型</option>`;
    getGalleryTypes().forEach(type => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        typeFilter.appendChild(option);
    });

    characterInput.innerHTML = `<option value="">未指定角色</option>`;
    characters.forEach(character => {
        const option = document.createElement("option");
        option.value = character.id;
        option.textContent = character.name || "未命名角色";
        characterInput.appendChild(option);
    });

    typeInput.innerHTML = "";
    getGalleryTypes().forEach(type => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        typeInput.appendChild(option);
    });

    if ([...characterFilter.options].some(o => o.value === oldCharacter)) characterFilter.value = oldCharacter;
    if ([...typeFilter.options].some(o => o.value === oldType)) typeFilter.value = oldType;
    if ([...characterInput.options].some(o => o.value === oldInputCharacter)) characterInput.value = oldInputCharacter;
    if ([...typeInput.options].some(o => o.value === oldInputType)) typeInput.value = oldInputType;
}

function getFilteredGalleryItems() {
    const characterFilter = document.getElementById("galleryCharacterFilter")?.value || "";
    const typeFilter = document.getElementById("galleryTypeFilter")?.value || "";
    const search = (document.getElementById("gallerySearchInput")?.value || "").trim().toLowerCase();

    return galleryItems
        .filter(item => {
            if (characterFilter === "__none__" && item.characterId) return false;
            if (characterFilter && characterFilter !== "__none__" && item.characterId !== characterFilter) return false;
            if (typeFilter && item.type !== typeFilter) return false;
            if (search) {
                const haystack = `${item.title || ""} ${item.note || ""} ${galleryCharacterName(item.characterId)} ${item.type || ""}`.toLowerCase();
                if (!haystack.includes(search)) return false;
            }
            return true;
        })
        .sort((a,b) => Number(b.created || 0) - Number(a.created || 0));
}

function renderGallery() {
    const grid = document.getElementById("galleryGrid");
    if (!grid) return;
    const items = getFilteredGalleryItems();

    if (!items.length) {
        grid.innerHTML = `<div class="empty-state gallery-empty"><div style="font-size:18px;font-weight:700;margin-bottom:8px;">尚無相簿圖片</div><div>點擊「上傳圖片」開始建立角色相簿。</div></div>`;
        return;
    }

    grid.innerHTML = items.map(item => `
        <article class="gallery-card" data-gallery-id="${escapeHtml(item.id)}">
            <img class="gallery-thumb" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title || "相簿圖片")}" data-gallery-view="${escapeHtml(item.id)}">
            <div class="gallery-card-info">
                <div class="gallery-card-title">${escapeHtml(item.title || "未命名圖片")}</div>
                <div class="gallery-card-meta">
                    <span class="gallery-tag">${escapeHtml(galleryCharacterName(item.characterId))}</span>
                    <span class="gallery-tag">${escapeHtml(item.type || "其他")}</span><br>
                    ${escapeHtml(galleryFormatBytes(dataUrlBytes(item.image)))}
                    ${item.note ? ` · ${escapeHtml(item.note)}` : ""}
                </div>
                <div class="gallery-card-actions">
                    <button class="secondary-btn" data-gallery-edit="${escapeHtml(item.id)}">編輯</button>
                    <button class="danger-btn" data-gallery-delete="${escapeHtml(item.id)}">刪除</button>
                </div>
            </div>
        </article>
    `).join("");
}

function openGalleryEditModal(item = null) {
    editingGalleryId = item?.id || null;
    galleryPendingImage = item?.image || "";
    document.getElementById("galleryEditModalTitle").textContent = item ? "編輯相簿圖片" : "新增相簿圖片";
    document.getElementById("galleryCharacterInput").value = item?.characterId || "";
    document.getElementById("galleryTypeInput").value = item?.type || getGalleryTypes()[0] || "其他";
    document.getElementById("galleryTitleInput").value = item?.title || "";
    document.getElementById("galleryNoteInput").value = item?.note || "";
    const preview = document.getElementById("galleryEditPreview");
    const empty = document.getElementById("galleryEditPreviewEmpty");
    if (galleryPendingImage) {
        preview.src = galleryPendingImage;
        preview.style.display = "block";
        empty.style.display = "none";
    } else {
        preview.src = "";
        preview.style.display = "none";
        empty.style.display = "inline";
    }
    document.getElementById("galleryEditModal").classList.add("show");
}

function closeGalleryEditModal() {
    document.getElementById("galleryEditModal").classList.remove("show");
    editingGalleryId = null;
    galleryPendingImage = "";
}

async function saveGalleryEdit() {
    const title = document.getElementById("galleryTitleInput").value.trim();
    const note = document.getElementById("galleryNoteInput").value.trim();
    const characterId = document.getElementById("galleryCharacterInput").value;
    const type = document.getElementById("galleryTypeInput").value || "其他";
    if (!galleryPendingImage) {
        alert("請先選擇圖片。");
        return;
    }

    const oldItem = galleryItems.find(item => item.id === editingGalleryId);
    const item = {
        ...(oldItem || {}),
        id: editingGalleryId || generateId(),
        image: galleryPendingImage,
        characterId,
        type,
        title,
        note,
        created: oldItem?.created || Date.now(),
        updated: Date.now()
    };

    try {
        if (editingGalleryId) {
            const index = galleryItems.findIndex(existing => existing.id === item.id);
            if (index >= 0) galleryItems[index] = item;
        } else {
            galleryItems.push(item);
        }
        if (!cloudMode || !currentUser) saveGalleryLocal();
        await saveGalleryItem(item);
        renderGalleryFilters();
        renderGallery();
        closeGalleryEditModal();
    } catch (error) {
        console.error(error);
        if (oldItem) {
            const index = galleryItems.findIndex(existing => existing.id === oldItem.id);
            if (index >= 0) galleryItems[index] = oldItem;
        } else {
            galleryItems = galleryItems.filter(existing => existing.id !== item.id);
        }
        alert(error.message || "相簿圖片儲存失敗。");
    }
}

async function handleGalleryUpload(files) {
    if (!files?.length) return;
    const progress = document.getElementById("galleryUploadProgress");
    progress.style.display = "block";
    let completed = 0;

    try {
        for (const file of [...files]) {
            completed += 1;
            progress.textContent = `正在處理圖片 ${completed} / ${files.length}…`;
            const image = await compressGalleryImage(file);
            const baseName = file.name.replace(/\.[^.]+$/, "");
            const item = {
                id: generateId(),
                image,
                characterId: "",
                type: getGalleryTypes()[0] || "其他",
                title: baseName,
                note: "",
                created: Date.now() + completed,
                updated: Date.now()
            };
            galleryItems.push(item);
            if (!cloudMode || !currentUser) {
                saveGalleryLocal();
            } else {
                await saveGalleryItem(item);
            }
        }
        renderGalleryFilters();
        renderGallery();
        const last = galleryItems[galleryItems.length - 1];
        if (last) openGalleryEditModal(last);
    } catch (error) {
        console.error(error);
        alert(error.message || "圖片處理失敗。");
        if (cloudMode && currentUser) {
            // Keep successfully uploaded items; failed items are removed only if their cloud write did not succeed.
        }
    } finally {
        progress.style.display = "none";
        progress.textContent = "";
        document.getElementById("galleryFileInput").value = "";
    }
}

async function deleteGallery(id) {
    const item = galleryItems.find(existing => existing.id === id);
    if (!item) return;
    if (!confirm(`確定要刪除「${item.title || "未命名圖片"}」嗎？`)) return;

    const previous = [...galleryItems];
    galleryItems = galleryItems.filter(existing => existing.id !== id);
    try {
        if (!cloudMode || !currentUser) saveGalleryLocal();
        await deleteGalleryItem(id);
        renderGallery();
    } catch (error) {
        console.error(error);
        galleryItems = previous;
        alert("相簿圖片刪除失敗。");
    }
}

function openGalleryViewer(id) {
    const items = getFilteredGalleryItems();
    galleryViewerIndex = items.findIndex(item => item.id === id);
    if (galleryViewerIndex < 0) return;
    renderGalleryViewer();
    document.getElementById("galleryViewerModal").classList.add("show");
}

function renderGalleryViewer() {
    const items = getFilteredGalleryItems();
    if (!items.length || galleryViewerIndex < 0 || galleryViewerIndex >= items.length) return;
    const item = items[galleryViewerIndex];
    document.getElementById("galleryViewerImage").src = item.image;
    document.getElementById("galleryViewerTitle").textContent = item.title || "未命名圖片";
    document.getElementById("galleryViewerMeta").textContent = `${galleryCharacterName(item.characterId)} · ${item.type || "其他"} · ${galleryFormatBytes(dataUrlBytes(item.image))}`;
    document.getElementById("galleryViewerNote").textContent = item.note || "";
    document.getElementById("galleryPrevBtn").disabled = items.length <= 1;
    document.getElementById("galleryNextBtn").disabled = items.length <= 1;
}

function closeGalleryViewer() {
    document.getElementById("galleryViewerModal").classList.remove("show");
}

function openGalleryTypeManager() {
    renderGalleryTypeManager();
    document.getElementById("galleryTypeModal").classList.add("show");
}

function renderGalleryTypeManager() {
    const list = document.getElementById("galleryTypeList");
    list.innerHTML = "";
    getGalleryTypes().forEach(type => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid #eee;border-radius:8px;";
        const name = document.createElement("span");
        name.textContent = type;
        const button = document.createElement("button");
        button.className = "danger-btn";
        button.textContent = "刪除";
        button.disabled = getGalleryTypes().length <= 1;
        button.addEventListener("click", () => {
            const next = getGalleryTypes().filter(item => item !== type);
            saveGalleryTypes(next);
            renderGalleryTypeManager();
            renderGalleryFilters();
            renderGallery();
        });
        row.append(name, button);
        list.appendChild(row);
    });
}

function initGallery() {
    renderGalleryFilters();
    renderGallery();

    document.getElementById("galleryUploadBtn").addEventListener("click", () => {
        document.getElementById("galleryFileInput").click();
    });
    document.getElementById("galleryFileInput").addEventListener("change", event => handleGalleryUpload(event.target.files));
    document.getElementById("galleryCharacterFilter").addEventListener("change", renderGallery);
    document.getElementById("galleryTypeFilter").addEventListener("change", renderGallery);
    document.getElementById("gallerySearchInput").addEventListener("input", renderGallery);
    document.getElementById("galleryManageTypesBtn").addEventListener("click", openGalleryTypeManager);
    document.getElementById("closeGalleryTypeBtn").addEventListener("click", () => document.getElementById("galleryTypeModal").classList.remove("show"));
    document.getElementById("galleryAddTypeBtn").addEventListener("click", () => {
        const input = document.getElementById("galleryNewTypeInput");
        const value = input.value.trim();
        if (!value) return;
        saveGalleryTypes([...getGalleryTypes(), value]);
        input.value = "";
        renderGalleryTypeManager();
        renderGalleryFilters();
    });
    document.getElementById("cancelGalleryEditBtn").addEventListener("click", closeGalleryEditModal);
    document.getElementById("saveGalleryEditBtn").addEventListener("click", saveGalleryEdit);
    document.getElementById("closeGalleryViewerBtn").addEventListener("click", closeGalleryViewer);
    document.getElementById("galleryPrevBtn").addEventListener("click", () => {
        const items = getFilteredGalleryItems();
        if (!items.length) return;
        galleryViewerIndex = (galleryViewerIndex - 1 + items.length) % items.length;
        renderGalleryViewer();
    });
    document.getElementById("galleryNextBtn").addEventListener("click", () => {
        const items = getFilteredGalleryItems();
        if (!items.length) return;
        galleryViewerIndex = (galleryViewerIndex + 1) % items.length;
        renderGalleryViewer();
    });

    document.getElementById("galleryGrid").addEventListener("click", event => {
        const view = event.target.closest("[data-gallery-view]");
        if (view) {
            openGalleryViewer(view.dataset.galleryView);
            return;
        }
        const edit = event.target.closest("[data-gallery-edit]");
        if (edit) {
            const item = galleryItems.find(existing => existing.id === edit.dataset.galleryEdit);
            if (item) openGalleryEditModal(item);
            return;
        }
        const del = event.target.closest("[data-gallery-delete]");
        if (del) deleteGallery(del.dataset.galleryDelete);
    });

    ["galleryEditModal", "galleryViewerModal", "galleryTypeModal"].forEach(id => {
        document.getElementById(id).addEventListener("click", event => {
            if (event.target.id === id) document.getElementById(id).classList.remove("show");
        });
    });

    document.addEventListener("keydown", event => {
        const viewer = document.getElementById("galleryViewerModal");
        if (!viewer.classList.contains("show")) return;
        if (event.key === "Escape") closeGalleryViewer();
        if (event.key === "ArrowLeft") document.getElementById("galleryPrevBtn").click();
        if (event.key === "ArrowRight") document.getElementById("galleryNextBtn").click();
    });
}

initGallery();


</script>
