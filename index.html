<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVCA 角色庫</title>
<style>
:root{
  --bg:#f5f3f7; --panel:#fff; --text:#28242d; --muted:#817986;
  --accent:#77658f; --accent2:#a78db8; --line:#e8e1eb; --danger:#b95757;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:1400px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
h1{margin:0;font-size:28px}.subtitle{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 15px;border-radius:12px;background:#eee8f1;color:var(--text)}
.btn.primary{background:var(--accent);color:white}.btn.danger{background:#f6e3e3;color:var(--danger)}
.user-info{font-size:14px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
.search{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px #3d294008}
.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee9f0;display:block}
.card-body{padding:15px}.name{font-size:19px;font-weight:700}.meta{font-size:13px;color:var(--muted);margin:5px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#f0ebf3;color:#665a70;padding:4px 8px;border-radius:999px;font-size:12px}
.card-actions{display:flex;gap:7px;margin-top:14px}.small{padding:7px 10px;border-radius:999px;background:#f0edf2}
.empty{text-align:center;padding:70px 20px;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:18px}
.modal{position:fixed;inset:0;background:#20192788;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}.dialog{background:white;border-radius:20px;width:min(850px,100%);max-height:92vh;overflow:auto;padding:22px}
.dialog h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted);font-weight:600}
.preview{width:130px;height:130px;border-radius:16px;object-fit:cover;background:#eee9f0;border:1px solid var(--line)}
.avatar-row{display:flex;align-items:center;gap:15px}.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.detail{display:grid;grid-template-columns:180px 1fr;gap:20px}.detail img{width:180px;aspect-ratio:1;object-fit:cover;border-radius:18px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.info-box{background:#f8f5f9;border-radius:12px;padding:11px}.info-box b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
@media(max-width:650px){.app{padding:14px}.form,.detail,.info-grid{grid-template-columns:1fr}.detail img{width:150px}.dialog{padding:16px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>✦ 角色庫</h1><div class="subtitle">建立、搜尋與整理你的世界觀角色</div></div>
  <div class="actions">
    <div id="userStatus" class="user-info">離線本機模式</div>
    <button id="loginBtn" class="btn primary" onclick="handleLogin()">使用 Google 登入</button>
    <button id="logoutBtn" class="btn" style="display:none;" onclick="handleLogout()">登出</button>

    <button class="btn" onclick="exportData()">匯出資料</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">匯入資料</button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
    <button class="btn primary" onclick="openEditor()">＋ 新增角色</button>
  </div>
</header>

<div class="toolbar">
  <input id="search" class="search" placeholder="搜尋姓名、稱號、興趣、設定……" oninput="render()">
  <select id="faction" onchange="render()"><option value="">全部陣營</option></select>
  <select id="sort" onchange="render()">
    <option value="name">依姓名</option><option value="birthday">依生日</option><option value="created">依建立時間</option>
  </select>
</div>

<main id="cards"></main>
</div>

<div class="modal" id="editorModal">
<div class="dialog">
  <h2 id="editorTitle">新增角色</h2>
  <form id="form" onsubmit="event.preventDefault();">
    <input type="hidden" id="id">
    <div class="field full"><label>角色頭像</label><div class="avatar-row">
      <img id="preview" class="preview" alt="頭像預覽">
      <input id="avatar" type="file" accept="image/*" onchange="previewImage(event)">
    </div></div>
    <div class="field"><label>姓名 *</label><input id="name" required placeholder="例如：XXX"></div>
    <div class="field"><label>稱號／別名</label><input id="alias" placeholder="例如：花精靈王"></div>
    <div class="field"><label>生日</label><input id="birthday" type="date"></div>
    <div class="field"><label>年齡</label><input id="age" placeholder="例如：不明／永生"></div>
    <div class="field"><label>性別</label><input id="gender" placeholder="例如：女"></div>
    <div class="field"><label>種族</label><input id="race" placeholder="例如：吸血鬼×人類"></div>
    <div class="field"><label>陣營</label><input id="factionInput" placeholder="例如：普諾齊"></div>
    <div class="field"><label>居住地</label><input id="home" placeholder="例如：某座哥德式城堡"></div>
    <div class="field"><label>職業／身分</label><input id="job" placeholder="例如：魔法師、神官"></div>
    <div class="field"><label>喜歡</label><input id="likes" placeholder="用逗號分隔，例如：花、甜點、夜晚"></div>
    <div class="field"><label>討厭</label><input id="dislikes" placeholder="用逗號分隔"></div>
    <div class="field"><label>生日花／代表物</label><input id="symbol" placeholder="可自由填寫"></div>
    <div class="field"><label>能力／魔法</label><input id="powers" placeholder="例如：植物魔法、治癒"></div>
    <div class="field full"><label>性格</label><textarea id="personality" rows="3" placeholder="個性、習慣、說話方式……"></textarea></div>
    <div class="field full"><label>背景故事</label><textarea id="backstory" rows="5" placeholder="角色過去、重要事件、人物關係……"></textarea></div>
    <div class="field full"><label>備註／劇情伏筆</label><textarea id="notes" rows="4" placeholder="還沒決定的設定也可以先記在這裡"></textarea></div>
  </form>
  <div class="footer-actions">
    <button class="btn" onclick="closeEditor()">取消</button>
    <button class="btn primary" onclick="saveCharacter()">儲存角色</button>
  </div>
</div>
</div>

<div class="modal" id="detailModal">
<div class="dialog">
  <div id="detailContent"></div>
  <div class="footer-actions"><button class="btn" onclick="closeDetail()">關閉</button></div>
</div>
</div>

<script>
  // 1. 全域變數與基礎功能（保證本機功能隨時可用）
  let chars = JSON.parse(localStorage.getItem('rvca_chars') || '[]');
  let tempAvatar = '';
  let currentUser = null;
  let authObj = null, dbObj = null, providerObj = null, authMethods = {};

  const $ = id => document.getElementById(id);

  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function placeholder(name='角色'){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#eee9f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#887d8e" font-size="42">${name.slice(0,8)}</text></svg>`);}
  function splitTags(s){return (s||'').split(',').map(x=>x.trim()).filter(Boolean)}

  function updateFaction(){
    let fs=[...new Set(chars.map(c=>c.faction).filter(Boolean))].sort();
    let el=$('faction'),old=el.value;
    el.innerHTML='<option value="">全部陣營</option>'+fs.map(f=>`<option>${esc(f)}</option>`).join('');
    el.value=fs.includes(old)?old:'';
  }

  window.render = function(){
   updateFaction();
   let q=$('search').value.toLowerCase().trim(), f=$('faction').value, sort=$('sort').value;
   let list=chars.filter(c=>{
     let text=JSON.stringify(c).toLowerCase();
     return (!q||text.includes(q))&&(!f||c.faction===f);
   });
   list.sort((a,b)=>sort==='birthday'?(a.birthday||'').localeCompare(b.birthday||''):sort==='created'?(b.created||0)-(a.created||0):(a.name||'').localeCompare(b.name||''));
   if(!list.length){$('cards').innerHTML='<div class="empty">還沒有角色卡。<br><br>按右上角「＋ 新增角色」開始建立吧！</div>';return}
   $('cards').innerHTML='<div class="grid">'+list.map(c=>`
   <article class="card">
    <img class="card-img" src="${c.avatar||placeholder(c.name)}" alt="">
    <div class="card-body">
     <div class="name">${esc(c.name)}</div>
     <div class="meta">${esc(c.alias||'未設定稱號')} · ${esc(c.race||'未設定種族')}</div>
     <div class="tags">${[c.faction,c.job,...splitTags(c.likes).slice(0,2)].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
     <div class="card-actions">
      <button class="small" onclick="viewDetail('${c.id}')">查看</button>
      <button class="small" onclick="openEditor('${c.id}')">編輯</button>
      <button class="small" onclick="deleteCharacter('${c.id}')">刪除</button>
     </div>
    </div>
   </article>`).join('')+'</div>';
  }

  window.openEditor = function(id){
   $('editorModal').classList.add('show');
   let c=chars.find(x=>x.id===id);
   $('editorTitle').textContent=c?'編輯角色':'新增角色';
   $('form').reset(); tempAvatar=c?.avatar\vert{}\vert{}'';$('id').value=c?.id||'';
   if(c) ['name','alias','birthday','age','gender','race','factionInput','home','job','likes','dislikes','symbol','powers','personality','backstory','notes'].forEach(k=>$(k).value=c[k]\vert{}\vert{}'');$('preview').src=tempAvatar||placeholder(c?.name||'角色');
  }

  window.closeEditor = function(){$('editorModal').classList.remove('show')}

  window.previewImage = function(e){
   let file=e.target.files[0]; if(!file)return;
   let r=new FileReader();r.onload=()=>{tempAvatar=r.result;$('preview').src=tempAvatar};r.readAsDataURL(file);
  }

  window.saveCharacter = async function(){
   let id=$('id').value||crypto.randomUUID();
   let old=chars.find(c=>c.id===id);
   let c={id,created:old?.created||Date.now(),avatar:tempAvatar};
   ['name','alias','birthday','age','gender','home','job','likes','dislikes','symbol','powers','personality','backstory','notes'].forEach(k=>c[k]=$(k).value.trim());
   c.race=$('race').value.trim();c.faction=$('factionInput').value.trim();
   if(!c.name){alert('請至少填寫姓名！');return}
   if(old) Object.assign(old,c); else chars.push(c);
   
   closeEditor();
   render();
   saveLocalAndCloud();
  }

  window.deleteCharacter = async function(id){
   let c=chars.find(x=>x.id===id);if(!c)return;
   if(confirm(`確定要刪除「${c.name}」嗎？`)){
     chars=chars.filter(x=>x.id!==id);
     render();
     saveLocalAndCloud();
   }
  }

  window.viewDetail = function(id){
   let c=chars.find(x=>x.id===id);if(!c)return;
   let fields=[['生日',c.birthday],['年齡',c.age],['性別',c.gender],['種族',c.race],['陣營',c.faction],['居住地',c.home],['職業／身分',c.job],['代表物',c.symbol],['能力／魔法',c.powers],['喜歡',c.likes],['討厭',c.dislikes]];
   $('detailContent').innerHTML=`
   <div class="detail">
    <img src="${c.avatar||placeholder(c.name)}" alt="">
    <div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.alias||'')}</div>
     <div class="info-grid">${fields.map(([k,v])=>`<div class="info-box"><b>${k}</b>${esc(v||'—')}</div>`).join('')}</div>
    </div>
   </div>
   <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
   <div class="info-box"><b>性格</b>${esc(c.personality||'—').replace(/\n/g,'<br>')}</div><br>
   <div class="info-box"><b>背景故事</b>${esc(c.backstory||'—').replace(/\n/g,'<br>')}</div><br>
   <div class="info-box"><b>備註／劇情伏筆</b>${esc(c.notes||'—').replace(/\n/g,'<br>')}</div>`;
   $('detailModal').classList.add('show');
  }

  window.closeDetail = function(){$('detailModal').classList.remove('show')}

  window.exportData = function(){
   let blob=new Blob([JSON.stringify(chars,null,2)],{type:'application/json'});
   let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RVCA角色庫.json';a.click();URL.revokeObjectURL(a.href);
  }

  window.importData = function(e){
   let file=e.target.files[0];if(!file)return;
   let r=new FileReader();r.onload=()=>{
    try{
      let data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;
      chars=data;
      render();
      saveLocalAndCloud();
      alert('匯入成功！');
    }catch{alert('這不是有效的角色庫 JSON 檔案。')}
   };r.readAsText(file);e.target.value='';
  }

  function saveLocalAndCloud(){
    localStorage.setItem('rvca_chars', JSON.stringify(chars));
    if(currentUser && authMethods.saveToCloud){
      authMethods.saveToCloud();
    }
  }

  window.handleLogin = function(){
    if(authMethods.signIn){
      authMethods.signIn();
    } else {
      alert("Firebase 雲端服務尚未載入完成，請稍後再試或使用離線模式。");
    }
  }

  window.handleLogout = function(){
    if(authMethods.signOut) authMethods.signOut();
  }

  // 畫面初始渲染
  render();
</script>

<!-- 2. 異步載入 Firebase，不干擾頁面基礎運作 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  try {
    const firebaseConfig = {
      apiKey: "AIzaSyAJu6ccYAYRksvKMKL6Mp4PQ96T8366VuE",
      authDomain: "lioraviel-archive.firebaseapp.com",
      projectId: "lioraviel-archive",
      storageBucket: "lioraviel-archive.firebasestorage.app",
      messagingSenderId: "409769389977",
      appId: "1:409769389977:web:50bf5ef50a7a309676ad08",
      measurementId: "G-WW2VYQF038"
    };

    const app = initializeApp(firebaseConfig);
    authObj = getAuth(app);
    dbObj = getFirestore(app);
    providerObj = new GoogleAuthProvider();

    authMethods.signIn = () => signInWithRedirect(authObj, providerObj);
    authMethods.signOut = () => signOut(authObj);
    authMethods.saveToCloud = async () => {
      if (!currentUser) return;
      try {
        await setDoc(doc(dbObj, "character_libraries", currentUser.uid), {
          characters: chars,
          updatedAt: new Date()
        });
      } catch(e) { console.error("雲端儲存錯誤", e); }
    };

    getRedirectResult(authObj).then(res => {
      if(res && res.user) alert("登入成功！歡迎 " + res.user.displayName);
    });

    onAuthStateChanged(authObj, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userStatus').textContent = `Hi, ${user.displayName}`;
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        
        try {
          const docSnap = await getDoc(doc(dbObj, "character_libraries", user.uid));
          if (docSnap.exists()) {
            chars = docSnap.data().characters || [];
            localStorage.setItem('rvca_chars', JSON.stringify(chars));
            render();
          }
        } catch(e){}
      } else {
        currentUser = null;
        document.getElementById('userStatus').textContent = '離線本機模式';
        document.getElementById('loginBtn').style.display = 'inline-block';
        document.getElementById('logoutBtn').style.display = 'none';
      }
    });
  } catch (err) {
    console.error("Firebase 初始化失敗，已切換至本機模式:", err);
  }
</script>
</body>
</html>
